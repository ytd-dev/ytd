[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ymd"
version = "0.0.1"
description = "YaMus Downloader"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yandex-music>=3.2.0",
    "mutagen>=1.47.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
# Опционально: если захотят гонять через socks5-прокси
proxy = ["pysocks>=1.7.1"]

[project.scripts]
# Это свяжет команду в терминале с точкой входа в коде
ymd = "ymd.cli.main:main"